[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compactts-agent"
version = "0.1.0"
description = "CompactTS-Agent: Autonomous Agentic Time-Series Meta-Forecaster"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSL-1.1"}
authors = [
    {name = "Daksh Bhalala"}
]
keywords = ["time-series", "forecasting", "agentic-ai", "meta-routing", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "einops>=0.7.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/DakshBhalala/CompactTS-Agent"
Repository = "https://github.com/DakshBhalala/CompactTS-Agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
